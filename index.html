<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Journal</title>
<meta name="description" content="News, classes and offers from the studio. A demo Presence v3 site that Content Studio publishes into.">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">Demo site</p>
    <h1 class="site-title">Studio Journal</h1>
    <p class="site-sub">Monthly news, classes and offers. Every post here was committed by Content Studio.</p>
  </div>
</header>
<main class="wrap">
  <p id="status" class="status" role="status">Loading posts…</p>
  <ol id="posts" class="post-list" hidden></ol>
</main>
<footer class="site-foot">
  <div class="wrap">A static demo site. No build step and no CMS: the post list is <code>posts/index.json</code>.</div>
</footer>
</body>
</html>
